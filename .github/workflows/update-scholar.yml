name: Update Google Scholar statistics and publish site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'    
            
      - name: Install Scholar reader
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          python -m pip install scholarly "bibtexparser==1.4.3"
      
      - name: Retrieve citation figures
        if: github.event_name != 'push'
        id: scholar
        run: |
          if python update_scholar.py; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
            test -f scholar-data.json
          fi

      - name: Save updated statistics to GitHub
        if: steps.scholar.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar-data.json
          git diff --cached --quiet || git commit -m "Update Google Scholar statistics"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
